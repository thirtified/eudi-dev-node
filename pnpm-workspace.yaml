# esbuild (via tsx) finds its binary through optional dependencies, so its
# install script isn't needed.
allowBuilds:
  esbuild: false

# Don't resolve versions published less than a day ago (minutes).
minimumReleaseAge: 1440

# Our own platform packages are pinned right after we publish them, so they
# would otherwise block every lockfile refresh for a day after a release.
minimumReleaseAgeExclude:
  - '@thirtified/eudi-dev-*'
