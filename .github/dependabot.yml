version: 2

updates:
  # pnpm projects use the npm ecosystem; Dependabot updates pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Bumped only together with src/version.ts, after the platform packages
      # for the new upstream release are published (see upstream-watch.yml).
      - dependency-name: '@thirtified/eudi-dev-*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
