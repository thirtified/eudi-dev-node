name: Release

# Push a tag v<version of package.json> to release everything, or run it by
# hand. The platform packages are staged first, because the main package pins
# them in optionalDependencies. Versions already published or staged are
# skipped, so a rerun is safe.
#
# Staged publishing: the jobs run `npm stage publish`, so nothing goes live
# until a maintainer approves each staged version with 2FA, on npmjs.com or
# with `npm stage approve <id>`. Approve the four platform packages BEFORE
# the main package: npm skips a missing optional dependency silently, so a
# live main package without its platform packages installs without a binary.
#
# Staging needs the package to exist on npm already. The first publish of
# each package is manual (see "First release" in the README).
#
# Both jobs run in the "npm" environment, which holds the NPM_TOKEN secret (a
# granular token limited to staging). Later npm trusted publishing can
# replace it: `npm trust github <pkg> --repo thirtified/eudi-dev-node
# --file release.yml --env npm --allow-stage-publish`.
#
# pnpm installs and builds; npm publishes, because npm's CLI is what
# provenance and trusted publishing are specified against. The main package
# has no workspace: dependencies, so npm can publish it as is.
#
# No dependency cache here: a release shouldn't restore a cache that a PR
# build could have written.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      main:
        description: Also publish the main package (@thirtified/eudi-dev)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  platform-packages:
    runs-on: ubuntu-latest
    # Waits for approval by a reviewer of the "npm" environment.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # `npm stage` needs a recent npm; pin it rather than rely on Node's bundled one.
      - run: npm install -g npm@11.20.0 # zizmor: ignore[adhoc-packages] exact version, needed for npm stage

      # The version comes from the main package's optionalDependencies, so a
      # repackaging release (3.10.1-1) only needs "--sync-main" locally.
      # --verify-main fails unless all four pins agree.
      - name: Build platform packages
        run: |
          version=$(node -p "require('./package.json').optionalDependencies['@thirtified/eudi-dev-linux-x64']")
          node scripts/build-platform-packages.mjs --package-version "$version" --verify-main

      - name: Stage platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          . scripts/release-lib.sh
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if already_released "$name" "$version"; then continue; fi
            # --tag latest: a repackaging version like 3.10.1-1 is a semver
            # prerelease, which npm refuses without a tag.
            (cd "$dir" && npm stage publish --provenance --access public --tag latest)
            staged "$name" "$version"
          done

  main-package:
    needs: platform-packages
    if: github.event_name == 'push' || inputs.main
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # `npm stage` needs a recent npm; pin it rather than rely on Node's bundled one.
      - run: npm install -g npm@11.20.0 # zizmor: ignore[adhoc-packages] exact version, needed for npm stage

      - name: Check tag and repository
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $version"
            exit 1
          fi
          if [ "$(node -p "Boolean(require('./package.json').repository)")" != "true" ]; then
            echo "::error::package.json needs a repository field for npm provenance"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

      - run: pnpm run build

      - name: Stage @thirtified/eudi-dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          . scripts/release-lib.sh
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if already_released "$name" "$version"; then exit 0; fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm stage publish --provenance --access public --tag "$tag"
          staged "$name" "$version"
          {
            echo ""
            echo "**Approve the platform packages first, then \`$name\`.** A live main package"
            echo "without its platform packages installs without a binary."
          } >> "$GITHUB_STEP_SUMMARY"
