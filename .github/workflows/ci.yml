name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      # Build, then publint and arethetypeswrong on the packed tarball.
      - run: pnpm run lint:package

  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, macos-15-intel is x64 (macos-13 is retired).
        # No Windows: there is no Windows platform package yet.
        os: [ubuntu-latest, macos-latest, macos-15-intel]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # pnpm skips an optional dependency it can't fetch (a platform package
      # that isn't published yet), and the frozen lockfile still passes.
      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      # Build this runner's platform package from the pinned upstream release
      # (checksum-verified) straight into node_modules, so the integration
      # tests go through the same resolver as an installed package.
      - name: Build platform package
        run: node scripts/build-platform-packages.mjs --only current --out node_modules/@thirtified

      - name: Integration tests
        run: pnpm run test:integration
